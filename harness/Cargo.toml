[package]
name = "aseryx-enclave-harness"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The workload that runs inside the attested container"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hpke = { version = "0.15.1", features = ["aes", "alloc", "getrandom", "hkdfsha2", "x25519"], default-features = false }
k256 = { version = "0.14.0", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["json", "rustls"] }
wasmtime = "51.0.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dev-dependencies]
sha2 = "0.11.1"
wat = "1.263.0"
