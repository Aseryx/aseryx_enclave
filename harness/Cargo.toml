[package]
name = "aseryx-enclave-harness"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The workload that runs inside the attested container"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sha3 = "0.12.0"
thiserror = "2.0.21"
wasmtime = "51.0.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dev-dependencies]
sha2 = "0.11.1"
wat = "1.263.0"
