name: spike policy

on:
  push:
    branches: ["spike/**"]
    paths:
      - ".github/workflows/spike-policy.yml"
      - "spike/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned confcom extension
        run: |
          az extension add --name confcom --version 2.4.1 --yes
          az version --output json
          docker version --format '{{.Server.Version}}'

      - name: Generate each debug-mode policy twice
        run: |
          mkdir -p out
          for dir in spike/*/; do
            name=$(basename "$dir")
            [ -f "$dir/template.json" ] || continue
            mkdir -p "out/$name"
            for n in a b; do
              cp "$dir/template.json" "out/$name/template-$n.json"
              az confcom acipolicygen --template-file "out/$name/template-$n.json" \
                --debug-mode --enable-stdio -y
              jq -r '.resources[0].properties.confidentialComputeProperties.ccePolicy' \
                "out/$name/template-$n.json" | base64 -d > "out/$name/policy-$n.rego"
              sha256sum "out/$name/policy-$n.rego" | tee "out/$name/policy-$n.sha256"
            done
            cmp "out/$name/policy-a.rego" "out/$name/policy-b.rego"
            cp "out/$name/template-a.json" "out/$name/template.json"
            sha256sum "out/$name/policy-a.rego" | cut -d' ' -f1 > "out/$name/policy.sha256"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-0.1-policy
          path: out/
          if-no-files-found: error
