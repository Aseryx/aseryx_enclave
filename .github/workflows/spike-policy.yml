name: spike policy

on:
  push:
    branches: ["spike/**"]
    paths:
      - ".github/workflows/spike-policy.yml"
      - "spike/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned confcom extension
        run: |
          az extension add --name confcom --version 2.4.1 --yes
          az version --output json
          docker version --format '{{.Server.Version}}'

      - name: Generate the debug-mode policy twice
        run: |
          mkdir -p out
          for n in a b; do
            cp spike/0.1/template.json "out/template-$n.json"
            az confcom acipolicygen --template-file "out/template-$n.json" \
              --debug-mode --enable-stdio -y
            jq -r '.resources[0].properties.confidentialComputeProperties.ccePolicy' \
              "out/template-$n.json" | base64 -d > "out/policy-$n.rego"
            sha256sum "out/policy-$n.rego" | tee "out/policy-$n.sha256"
          done
          cmp out/policy-a.rego out/policy-b.rego
          cp out/template-a.json out/template.json
          sha256sum out/policy-a.rego | cut -d' ' -f1 > out/policy.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spike-0.1-policy
          path: out/
          if-no-files-found: error
