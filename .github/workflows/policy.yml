name: policy

# Generates the production (non-debug) confidential container policy for the release template from the image this commit
# builds, at three container sizes, twice each (from the template's containers as a confcom policy config). The policy hash is the workload identity an owner's consent names, so it
# must not depend on the size, and every ENCLAVE_* variable must be allowed with exactly its value and nothing else; rules
# are anchored (scripts/anchor-policy.py) because the policy engine matches by search (see scripts/check-policy.py).
# Nothing is pushed or deployed.

on:
  push:
    branches: ["spike/**", "main"]
    paths:
      - ".github/workflows/policy.yml"
      - "scripts/*.py"
      - "release/**"
      - "Dockerfile"
      - "SOURCE_DATE_EPOCH"
      - "Cargo.toml"
      - "Cargo.lock"
      - "harness/Cargo.toml"
      - "harness/src/**"
      - "harness/circuit-pins.json"
      - "engine/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build the image into Docker, where confcom reads it
        run: |
          docker buildx create --name repro --driver docker-container \
            --driver-opt image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
          mkdir -p out
          docker buildx build --builder repro --platform linux/amd64 --no-cache \
            --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH="$(cat SOURCE_DATE_EPOCH)" \
            --output "type=docker,dest=out/image.tar,name=aseryx-enclave:release,rewrite-timestamp=true" .
          docker load -i out/image.tar
          docker image inspect aseryx-enclave:release --format '{{.Id}}'

      - name: Install the pinned confcom extension
        run: |
          az extension add --name confcom --version 2.4.1 --yes
          az version --output json

      - name: The anchoring and the checker are tested
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-policy.py --self-test

      - name: Generate the production policy for each size, twice
        run: |
          # The template's containers are the policy config's containers; the memory setting is the one pattern rule, so
          # the three container sizes share one policy (and so one workload identity)
          for size in 2 4 16; do
            for n in a b; do
              d="out/$size-$n"
              mkdir -p "$d"
              jq --argjson size "$size" '
                (.resources[0].properties.containers[] | select(.name == "enclave-workload") | .properties.resources.requests.memoryInGB) = $size
                | (.resources[0].properties.containers[] | select(.name == "enclave-workload") | .properties.environmentVariables[] | select(.name == "ENCLAVE_MEMORY_GB")) = {name: "ENCLAVE_MEMORY_GB", value: "([1-9]|[12][0-9]|3[0-2])", regex: true}
                | {containers: .resources[0].properties.containers}
              ' release/template.json > "$d/config.json"
              az confcom acipolicygen --input "$d/config.json" --disable-stdio --print-policy > "$d/policy.b64"
              base64 -d "$d/policy.b64" > "$d/confcom.rego"
              # Every regular-expression environment rule becomes ^...$: the engine's match is a search, so an unanchored
              # rule would admit any variable whose text contains it. The deployed policy is this anchored text.
              python3 scripts/anchor-policy.py "$d/confcom.rego" "$d/policy.rego"
              base64 -w0 "$d/policy.rego" > "$d/policy.deploy.b64"
              sha256sum "$d/policy.rego" | cut -d' ' -f1 | tee "$d/policy.sha256"
              python3 scripts/check-policy.py "$d/policy.rego" release/template.json engine/appraisal_core_wasm_bg.wasm.sha256
            done
          done

      - name: One policy hash for every size and every run
        run: |
          cat out/*/policy.sha256 | sort -u | tee out/hashes
          [ "$(wc -l < out/hashes)" -eq 1 ]
          echo "policy hash $(cat out/hashes)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-policy
          path: out/
          if-no-files-found: error
