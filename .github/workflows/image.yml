name: image

# Builds the workload image twice from scratch and fails unless both builds have the same digest. A push to a branch
# pushes nothing. A manual run with `publish` set also copies the verified image to the public GitHub Container
# Registry under a tag of the commit and checks that the registry holds the digest the builds produced; only a run
# on main can publish.

on:
  push:
    branches: ["spike/**", "main"]
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "SOURCE_DATE_EPOCH"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "harness/Cargo.toml"
      - "harness/src/**"
      - "harness/circuit-pins.json"
      - "engine/**"
      - "engine-native/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the verified image to ghcr.io/aseryx/aseryx-enclave"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create the pinned BuildKit builder
        run: |
          docker buildx create --name repro --driver docker-container \
            --driver-opt image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
          docker buildx inspect repro --bootstrap

      - name: Build the image twice
        run: |
          epoch=$(cat SOURCE_DATE_EPOCH)
          mkdir -p out
          for n in a b; do
            docker buildx build --builder repro --platform linux/amd64 --no-cache \
              --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$epoch" \
              --output "type=oci,dest=out/image-$n.tar,rewrite-timestamp=true" .
            tar -xOf "out/image-$n.tar" index.json | jq -r '.manifests[0].digest' > "out/digest-$n"
            echo "build $n: $(cat out/digest-$n)"
          done

      - name: The two digests must be equal
        run: |
          cmp out/digest-a out/digest-b
          echo "image digest $(cat out/digest-a)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: out/digest-*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          name: image-oci
          path: |
            out/image-a.tar
            out/digest-a
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: reproducible
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aseryx/aseryx-enclave
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-oci
          path: out

      - name: Copy the verified image to the registry
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR_NAME" --password-stdin
          skopeo copy --preserve-digests "oci-archive:out/image-a.tar" "docker://$IMAGE:sha-${GITHUB_SHA::12}"

      - name: The registry holds the digest the builds produced
        run: |
          digest=$(cat out/digest-a)
          held=$(skopeo inspect --raw "docker://$IMAGE:sha-${GITHUB_SHA::12}" | sha256sum | cut -d' ' -f1)
          test "sha256:$held" = "$digest"
          echo "published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
