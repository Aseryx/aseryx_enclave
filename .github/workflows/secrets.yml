name: secrets

# A secret scan of every push and pull request: the working tree and the whole git history. This repository is public, so
# a secret that reaches it is published. The allowlist (.gitleaks.toml) names exact paths of public test tokens and pins.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSLf -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Working tree
        run: /tmp/gitleaks dir --no-banner --redact --config .gitleaks.toml .

      - name: Git history
        run: /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml .
